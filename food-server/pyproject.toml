[project]
name = "food-server"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [{ name = "Thomas Driscoll", email = "thomasd981@gmail.com" }]
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.159.0",
